name: Kopano Labs production gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-static-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required production files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s Cars4Mars/index.html
          test -s reports/KOPANO_LABS.pdf
          test -s robots.txt
          test -s sitemap.xml
          test -s release.json
      - name: Validate evidence truth state
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PENDING EVIDENCE' Cars4Mars/index.html
          grep -q 'NO ORDER EVIDENCE' Cars4Mars/index.html
          grep -q 'NOT STARTED' Cars4Mars/index.html
          grep -q 'CLOUD / LLM MOTOR AUTHORITY: NONE' Cars4Mars/index.html
      - name: Reject legacy zero-byte asset dependencies
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'public/images/cars4mars' . --exclude-dir=.git
      - name: Validate PDF signature and indexing
        shell: bash
        run: |
          set -euo pipefail
          head -c 8 reports/KOPANO_LABS.pdf | grep -q '%PDF-1.4'
          grep -q 'Allow: /' robots.txt
          grep -q 'https://kopanolabs.com/Cars4Mars/' sitemap.xml
